services:
  db:
    image: postgres:16
    container_name: secure-data-db
    environment:
      POSTGRES_DB: secure_data
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    container_name: secure-data-api
    environment:
      DATABASE_URL: postgresql://app_user:app_password@db:5432/secure_data
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data: