services:
  db:
    image: postgres:16
    container_name: secure-data-db
    environment:
      POSTGRES_DB: secure_data
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    container_name: secure-data-api
    environment:
      DATABASE_URL: postgresql://app_user:app_password@db:5432/secure_data
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      JWT_SECRET_KEY: development-only-change-me
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: secure-data-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_USE_MOCK_API: "false"
    depends_on:
      - api

volumes:
  postgres_data: